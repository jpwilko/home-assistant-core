rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Only standard CoverEntity actions are supported; no custom actions required or possible.
  appropriate-polling:
    status: done
    comment: Polls every 120 seconds via DataUpdateCoordinator.
  brands:
    status: done
    comment: Brand file present in homeassistant/brands/hunterdouglas.json.
  common-modules:
    status: done
    comment: Uses coordinator, entity base class, and config flow patterns.
  config-flow-test-coverage:
    status: done
    comment: All config flow paths are covered by tests in test_config_flow.py.
  config-flow:
    status: done
    comment: Config flow with auto-discovery and manual IP entry.
  dependency-transparency:
    status: done
    comment: Uses aio-powerrise-api library.
  docs-actions:
    status: exempt
    comment: No custom actions; only standard CoverEntity actions are supported.
  docs-high-level-description:
    status: exempt
    comment: Integration documentation is auto-generated and describes the integration at a high level.
  docs-installation-instructions:
    status: exempt
    comment: Installation is standard for Home Assistant integrations; no special instructions required.
  docs-removal-instructions:
    status: exempt
    comment: Removal is standard for Home Assistant integrations; no special instructions required.
  entity-event-setup:
    status: done
    comment: Entities set up via async_setup_entry.
  entity-unique-id:
    status: done
    comment: Unique ID based on hub host and shade ID.
  has-entity-name:
    status: done
    comment: Entities use has_entity_name = True.
  runtime-data:
    status: done
    comment: Uses entry.runtime_data with typed PowerRiseConfigEntry.
  test-before-configure:
    status: done
    comment: Config flow validates connection before creating entry.
  test-before-setup:
    status: done
    comment: async_setup_entry connects and fetches data before setup.
  unique-config-entry:
    status: done
    comment: Config entries are unique by host IP.

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
